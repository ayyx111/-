name: Deploy to IGA Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 在 GitHub 仓库 Settings > Secrets and variables > Actions > Variables 中添加:
# VITE_API_BASE_URL = https://你的railway后端地址/api/v1
# VITE_WS_URL = https://你的railway后端地址

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Debug env vars
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL from vars: ${{ vars.VITE_API_BASE_URL }}"
          echo "VITE_WS_URL from vars: ${{ vars.VITE_WS_URL }}"
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "❌ VITE_API_BASE_URL is EMPTY! 请在 GitHub Settings > Variables > Actions 中添加 VITE_API_BASE_URL=https://你的Railway后端域名/api/v1"
            exit 1
          fi
          echo "--- .env.production content ---"
          cat .env.production || echo "No .env.production file"

      - name: Build frontend
        working-directory: frontend
        env:
          # 优先读取 GitHub Variables 中的配置
          # 若 Variables 未配置,则留空,让 Vite 自动读取仓库中的 .env.production 文件
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          # 清除空值覆盖:如果 Variables 没设,就不要把空字符串强塞给 env,避免覆盖 .env.production 里的默认值
          if [ -z "$VITE_API_BASE_URL" ]; then unset VITE_API_BASE_URL; fi
          if [ -z "$VITE_WS_URL" ]; then unset VITE_WS_URL; fi
          echo "Build with VITE_API_BASE_URL=${VITE_API_BASE_URL:-<from .env.production>}"
          npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "--- Checking if Railway URL is in build ---"
          grep -l "resplendent-caring" dist/assets/*.js && echo "✅ Railway URL found in build" || echo "❌ Railway URL NOT found in build"

      - name: Install @iga-pages/cli
        run: npm i -g @iga-pages/cli@latest

      - name: IGA Pages Login (AK/SK)
        run: iga login --accessKey "${{ secrets.VOLC_ACCESS_KEY }}" --secretKey "${{ secrets.VOLC_SECRET_KEY }}"

      - name: Deploy to IGA Pages
        working-directory: frontend
        run: iga pages deploy --name campus-flea
