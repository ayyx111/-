name: Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== [1/5] 拉取最新代码 ==="
            git pull origin main

            echo "=== [2/5] 安装后端依赖 ==="
            cd backend
            npm install --production

            echo "=== [3/5] 构建前端 ==="
            cd ../frontend
            npm install
            npm run build

            echo "=== [4/5] 重启后端服务 ==="
            cd ../backend

            # 获取 MySQL/Redis 容器 IP
            MYSQL_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' campus_fish_mysql)
            REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' campus_fish_redis)

            # 杀掉旧进程
            pkill -f "node src/app.js" || true
            sleep 2

            # 启动新进程
            NODE_ENV=production \
            DB_TYPE=mysql \
            DB_HOST=$MYSQL_IP \
            DB_PORT=3306 \
            DB_USER=root \
            DB_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} \
            DB_NAME=campus_fish \
            DB_SYNC=true \
            DB_SYNC_FORCE=false \
            REDIS_HOST=$REDIS_IP \
            REDIS_PORT=6379 \
            JWT_SECRET=${{ secrets.JWT_SECRET }} \
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }} \
            UPLOAD_DIR=uploads \
            UPLOAD_PUBLIC_BASE_URL=${{ secrets.DOMAIN }} \
            CORS_ORIGIN=* \
            ADMIN_USERNAME=admin \
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} \
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
            RESEND_FROM=${{ secrets.RESEND_FROM }} \
            nohup node src/app.js > /tmp/campus-fish-backend.log 2>&1 &

            sleep 5

            # 检查后端是否启动成功
            if curl -s http://localhost:3000/health | grep -q "ok"; then
              echo "后端启动成功"
            else
              echo "后端启动失败,查看日志:"
              tail -30 /tmp/campus-fish-backend.log
              exit 1
            fi

            echo "=== [5/5] 重载 Nginx ==="
            sudo systemctl reload nginx

            echo ""
            echo "=== 部署完成 ==="
            echo "访问地址: ${{ secrets.DOMAIN }}"
