name: Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 600s
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== [1/6] 拉取最新代码 ==="
            git pull origin main

            echo "=== [2/6] 安装后端依赖 ==="
            cd backend
            npm install --production

            echo "=== [3/6] 构建前端 ==="
            cd ../frontend
            npm install
            npm run build

            echo "=== [4/6] 生成环境变量文件 ==="
            cd ../backend

            MYSQL_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' campus_fish_mysql)
            REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' campus_fish_redis)

            cat > .env.production << EOF
            NODE_ENV=production
            DB_TYPE=mysql
            DB_HOST=$MYSQL_IP
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_NAME=campus_fish
            DB_SYNC=true
            DB_SYNC_FORCE=false
            REDIS_HOST=$REDIS_IP
            REDIS_PORT=6379
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            UPLOAD_DIR=uploads
            UPLOAD_PUBLIC_BASE_URL=${{ secrets.DOMAIN }}
            CORS_ORIGIN=*
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM=${{ secrets.RESEND_FROM }}
            TRUST_PROXY=true
            EOF

            echo "=== [5/6] 用 PM2 重启后端服务 ==="
            # 确保 PM2 已安装
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # 停止旧进程(如果存在)
            pm2 delete campus-fish-backend 2>/dev/null || true

            # 用 PM2 启动
            pm2 start src/app.js --name campus-fish-backend --env production

            # 保存 PM2 进程列表,确保开机自启
            pm2 save

            # 等待后端启动(最多 30 秒)
            echo "等待后端启动..."
            for i in $(seq 1 15); do
              sleep 2
              if curl -s http://localhost:3000/api/v1/products?pageSize=1 | grep -q '"code":200'; then
                echo "后端启动成功 (耗时 $((i*2)) 秒)"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "后端启动失败,查看日志:"
                pm2 logs campus-fish-backend --lines 50 --nostream
                exit 1
              fi
            done

            echo "=== [6/6] 重载 Nginx ==="
            sudo systemctl reload nginx

            echo ""
            echo "=== 部署完成 ==="
            echo "访问地址: ${{ secrets.DOMAIN }}"
            pm2 status
