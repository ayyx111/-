services:
  - type: web
    name: campus-fish-email-relay
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: 校园咸鱼
      - key: API_TOKEN
        sync: false
