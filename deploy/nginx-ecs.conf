# Nginx 配置 — 云服务器直接部署(非 Docker)
# 复制到: /etc/nginx/sites-available/campus-fish
# 启用: ln -s /etc/nginx/sites-available/campus-fish /etc/nginx/sites-enabled/campus-fish

server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /opt/campus-fish/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 代理(保留 /api 前缀,后端路由为 /api/v1)
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 上传文件
    location /uploads/ {
        alias /opt/campus-fish/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 文件上传大小限制
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;
}
